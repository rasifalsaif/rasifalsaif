<svg viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bgGradient)" />

  <!-- Decorative Circles -->
  <circle cx="1200" cy="100" r="200" fill="#38bdf8" opacity="0.08" />
  <circle cx="1300" cy="400" r="150" fill="#6366f1" opacity="0.08" />

  <!-- Name -->
  <text
    x="100"
    y="200"
    font-size="64"
    font-weight="700"
    fill="url(#textGradient)"
    font-family="Poppins, sans-serif"
  >
    Abdullah Al Saif
  </text>

  <!-- Role -->
  <text
    x="100"
    y="260"
    font-size="32"
    fill="#cbd5f5"
    font-family="Inter, sans-serif"
  >
    Full Stack Developer
  </text>

  <!-- Tagline -->
  <text
    x="100"
    y="320"
    font-size="24"
    fill="#94a3b8"
    font-family="Inter, sans-serif"
  >
    Building scalable apps with React, Next.js &amp; Node.js
  </text>

  <!-- Code Block Style -->
  <g transform="translate(900, 220)">
    <rect
      width="420"
      height="180"
      rx="16"
      fill="#020617"
      stroke="#334155"
    />

    <text
      x="20"
      y="50"
      font-size="18"
      fill="#38bdf8"
      font-family="JetBrains Mono, monospace"
    >
      const dev = {
    </text>

    <text
      x="40"
      y="80"
      font-size="18"
      fill="#a78bfa"
      font-family="JetBrains Mono, monospace"
    >
      role: "Full Stack",
    </text>

    <text
      x="40"
      y="110"
      font-size="18"
      fill="#34d399"
      font-family="JetBrains Mono, monospace"
    >
      stack: ["Next.js", "Node"],
    </text>

    <text
      x="20"
      y="140"
      font-size="18"
      fill="#38bdf8"
      font-family="JetBrains Mono, monospace"
    >
      }
    </text>
  </g>
</svg>
